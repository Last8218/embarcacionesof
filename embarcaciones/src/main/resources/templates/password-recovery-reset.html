<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contrasena - Embarcaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
<div class="card p-4 shadow-lg" style="width: 430px;">
    <h2 class="text-center mb-3">Crear nueva contrasena</h2>

    <form th:action="@{/password/reset}" method="post" id="resetPasswordForm" th:if="${token}">
        <input type="hidden" name="token" th:value="${token}">

        <div class="mb-3">
            <label for="passwordNueva" class="form-label">Nueva contrasena</label>
            <input type="password" id="passwordNueva" name="passwordNueva" class="form-control" minlength="8" required>
        </div>

        <div class="mb-3">
            <label for="passwordConfirmacion" class="form-label">Confirmar nueva contrasena</label>
            <input type="password" id="passwordConfirmacion" name="passwordConfirmacion" class="form-control" minlength="8" required>
        </div>

        <p id="passwordMatchError" class="text-danger text-center d-none mb-3">Las contrasenas no coinciden.</p>

        <button type="submit" class="btn btn-primary w-100">Actualizar contrasena</button>
    </form>

    <p class="text-danger mt-3 text-center" th:if="${error}" th:text="${error}"></p>

    <div class="text-center mt-2">
        <a th:href="@{/login}">Volver al login</a>
    </div>
</div>

<script>
    const form = document.getElementById('resetPasswordForm');
    if (form) {
        form.addEventListener('submit', function (event) {
            const password = document.getElementById('passwordNueva').value;
            const confirmPassword = document.getElementById('passwordConfirmacion').value;
            const error = document.getElementById('passwordMatchError');

            if (password !== confirmPassword) {
                event.preventDefault();
                error.classList.remove('d-none');
            } else {
                error.classList.add('d-none');
            }
        });
    }
</script>
</body>
</html>

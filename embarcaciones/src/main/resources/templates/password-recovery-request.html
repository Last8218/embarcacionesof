<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contrasena - Embarcaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
<div class="card p-4 shadow-lg" style="width: 420px;">
    <h2 class="text-center mb-3">Recuperar contrasena</h2>
    <p class="text-muted text-center mb-4">Ingresa tu correo y te enviaremos instrucciones.</p>

    <form th:action="@{/password/forgot}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="usuario@correo.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar correo de recuperacion</button>
    </form>

    <p class="text-success mt-3 text-center" th:if="${success}" th:text="${success}"></p>
    <p class="text-danger mt-3 text-center" th:if="${error}" th:text="${error}"></p>

    <div class="text-center mt-2">
        <a th:href="@{/login}">Volver al login</a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Embarcaciones</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
  <style>
    body {
        height: 100vh;
    }
    .sidebar {
        height: 100vh;
        background-color: #343a40;
        color: #fff;
    }
    .sidebar a {
        color: #fff;
        text-decoration: none;
    }
    .sidebar a:hover {
        background-color: #495057;
    }
  </style>
</head>
<body>
<div class="d-flex">
  <!-- Barra lateral izquierda -->
  <div class="sidebar p-3">
    <h4>Menú</h4>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="#">Inicio</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Mantenimiento</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Embarcaciones</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Reportes</a>
      </li>
    </ul>
  </div>

  <!-- Contenido principal -->
  <div class="flex-grow-1">
    <!-- Barra horizontal superior -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <span class="navbar-brand">Embarcaciones</span>
        <div class="d-flex align-items-center">
          <span class="me-3">Usuario: <strong th:text="${remoteUser}"></strong></span>
          <a href="/logout" class="btn btn-danger btn-sm">Cerrar sesión</a>
        </div>
      </div>
    </nav>

    <!-- Contenido dinámico -->
    <div class="container mt-4">
      <h1>Bienvenido a la aplicación de Embarcaciones</h1>
      <p>Selecciona una opción del menú para comenzar.</p>
    </div>
  </div>
</div>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modoEdicion} ? 'Editar embarcacion' : 'Nueva embarcacion'">Embarcacion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg-page:#f3f8fb; --bg-sidebar:#0e2f3d; --bg-sidebar-soft:#134256; --bg-highlight:#0a3c52; --card-border:#e7eff3; }
        body { background: var(--bg-page); min-height: 100vh; font-family: "Segoe UI", Tahoma, sans-serif; }
        .app-shell { min-height: 100vh; }
        .sidebar { width: 280px; background: var(--bg-sidebar); color:#d2e4ec; padding:20px 16px; }
        .brand-box { background: var(--bg-sidebar-soft); border-radius:12px; padding:14px; margin-bottom:22px; }
        .brand-title { font-size:1rem; color:#fff; margin-bottom:2px; }
        .brand-subtitle { font-size:.8rem; color:#8fb4c3; margin:0; }
        .menu-label { font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:#77a0b1; margin:10px 0 8px; }
        .menu-link { display:flex; align-items:center; justify-content:space-between; color:#d0e4eb; text-decoration:none; border-radius:10px; padding:10px 12px; margin-bottom:6px; transition:.2s; font-size:.93rem; }
        .menu-link:hover,.menu-link.active { background:var(--bg-highlight); color:#fff; }
        .menu-next { font-size:.75rem; color:#81a7b7; }
        .main-content { flex:1; padding:18px 20px; }
        .topbar { background:#fff; border:1px solid var(--card-border); border-radius:14px; padding:10px 14px; margin-bottom:16px; }
        .search-box { border:1px solid #e4edf2; border-radius:10px; padding:8px 12px; width:100%; background:#f8fbfd; }
        .status-chip { background:#e5f7ec; color:#2f8f58; font-size:.78rem; font-weight:600; border-radius:999px; padding:6px 10px; }
        .panel { background:#fff; border:1px solid var(--card-border); border-radius:14px; padding:20px; }
    </style>
</head>
<body>
<div class="d-flex app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>

    <main class="main-content">
        <div th:replace="~{fragments/topbar :: topbar(${remoteUser})}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0" th:text="${modoEdicion} ? 'Editar embarcacion' : 'Nueva embarcacion'">Embarcacion</h1>
            <a th:href="@{/embarcaciones}" class="btn btn-outline-secondary">Volver</a>
        </div>

        <section class="panel">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:object="${embarcacion}" th:action="${modoEdicion} ? @{'/embarcaciones/' + *{idEmbarcacion}} : @{/embarcaciones}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="codigo">Codigo *</label>
                    <input id="codigo" class="form-control" type="text" th:field="*{codigo}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="nombre">Nombre *</label>
                    <input id="nombre" class="form-control" type="text" th:field="*{nombre}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="tipo">Tipo *</label>
                    <input id="tipo" class="form-control" type="text" th:field="*{tipo}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="matricula">Matricula *</label>
                    <input id="matricula" class="form-control" type="text" th:field="*{matricula}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="estado">Estado *</label>
                    <select id="estado" class="form-select" th:field="*{estado}" required>
                        <option value="OPERATIVO">OPERATIVO</option>
                        <option value="EN MANTENIMIENTO">EN MANTENIMIENTO</option>
                        <option value="FUERA DE SERVICIO">FUERA DE SERVICIO</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="ubicacion">Ubicacion *</label>
                    <input id="ubicacion" class="form-control" type="text" th:field="*{ubicacion}" required>
                </div>
                <div class="col-12">
                    <label class="form-label" for="descripcion">Descripcion *</label>
                    <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3" required></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label" for="obsevaciones">Observaciones</label>
                    <textarea id="obsevaciones" class="form-control" th:field="*{obsevaciones}" rows="3"></textarea>
                </div>

                <div class="col-12 d-flex gap-2">
                    <a th:href="@{/embarcaciones}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary" th:text="${modoEdicion} ? 'Guardar cambios' : 'Crear embarcacion'">Guardar</button>
                </div>
            </form>
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

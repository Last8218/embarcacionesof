<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle embarcacion - Embarcaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg-page:#f3f8fb; --bg-sidebar:#0e2f3d; --bg-sidebar-soft:#134256; --bg-highlight:#0a3c52; --card-border:#e7eff3; }
        body { background: var(--bg-page); min-height: 100vh; font-family: "Segoe UI", Tahoma, sans-serif; }
        .app-shell { min-height: 100vh; }
        .sidebar { width: 280px; background: var(--bg-sidebar); color:#d2e4ec; padding:20px 16px; }
        .brand-box { background: var(--bg-sidebar-soft); border-radius:12px; padding:14px; margin-bottom:22px; }
        .brand-title { font-size:1rem; color:#fff; margin-bottom:2px; }
        .brand-subtitle { font-size:.8rem; color:#8fb4c3; margin:0; }
        .menu-label { font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:#77a0b1; margin:10px 0 8px; }
        .menu-link { display:flex; align-items:center; justify-content:space-between; color:#d0e4eb; text-decoration:none; border-radius:10px; padding:10px 12px; margin-bottom:6px; transition:.2s; font-size:.93rem; }
        .menu-link:hover,.menu-link.active { background:var(--bg-highlight); color:#fff; }
        .menu-next { font-size:.75rem; color:#81a7b7; }
        .main-content { flex:1; padding:18px 20px; }
        .topbar { background:#fff; border:1px solid var(--card-border); border-radius:14px; padding:10px 14px; margin-bottom:16px; }
        .search-box { border:1px solid #e4edf2; border-radius:10px; padding:8px 12px; width:100%; background:#f8fbfd; }
        .status-chip { background:#e5f7ec; color:#2f8f58; font-size:.78rem; font-weight:600; border-radius:999px; padding:6px 10px; }
        .panel { background:#fff; border:1px solid var(--card-border); border-radius:14px; padding:20px; }
        .estado { border-radius:999px; padding:5px 12px; font-size:.85rem; font-weight:600; }
        .estado-operativo { background:#e7f8ed; color:#1c8b49; }
        .estado-mantenimiento { background:#fff4d9; color:#9a6a00; }
        .estado-fuera { background:#fde8e8; color:#b32c2c; }
    </style>
</head>
<body>
<div class="d-flex app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>

    <main class="main-content">
        <div th:replace="~{fragments/topbar :: topbar(${remoteUser})}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 mb-1" th:text="${embarcacion.nombre}">Nombre embarcacion</h1>
                <p class="text-secondary mb-0">Ficha tecnica y operativa</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/embarcaciones}" class="btn btn-outline-secondary">Volver</a>
                <a th:href="@{'/embarcaciones/' + ${embarcacion.idEmbarcacion} + '/editar'}" class="btn btn-primary">Editar embarcacion</a>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-lg-8">
                <section class="panel h-100">
                    <h2 class="h5 mb-3">Informacion general</h2>
                    <div class="row g-3">
                        <div class="col-md-4"><small class="text-secondary">Codigo</small><div class="fw-semibold" th:text="${embarcacion.idEmbarcacion}">1</div></div>
                        <div class="col-md-4"><small class="text-secondary">Tipo</small><div class="fw-semibold" th:text="${embarcacion.tipo}">Tipo</div></div>
                        <div class="col-md-4"><small class="text-secondary">Matricula</small><div class="fw-semibold" th:text="${embarcacion.matricula}">ABC-123</div></div>
                        <div class="col-md-6"><small class="text-secondary">Ubicacion</small><div class="fw-semibold" th:text="${embarcacion.ubicacion}">Ubicacion</div></div>
                        <div class="col-md-6"><small class="text-secondary">Descripcion</small><div class="fw-semibold" th:text="${embarcacion.descripcion}">Descripcion</div></div>
                        <div class="col-12"><small class="text-secondary">Observaciones</small><div class="fw-semibold" th:text="${embarcacion.obsevaciones != null && !#strings.isEmpty(embarcacion.obsevaciones) ? embarcacion.obsevaciones : 'Sin observaciones'}">Sin observaciones</div></div>
                    </div>
                </section>
            </div>

            <div class="col-lg-4">
                <section class="panel h-100">
                    <h2 class="h5 mb-3">Estado operativo</h2>
                    <span class="estado"
                          th:classappend="${embarcacion.estado == 'OPERATIVO'} ? ' estado-operativo' : (${embarcacion.estado == 'EN MANTENIMIENTO'} ? ' estado-mantenimiento' : ' estado-fuera')"
                          th:text="${embarcacion.estado}">OPERATIVO</span>
                </section>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Embarcaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg-page:#f3f8fb; --bg-sidebar:#0e2f3d; --bg-sidebar-soft:#134256; --bg-highlight:#0a3c52; --card-border:#e7eff3; }
        body { background: var(--bg-page); min-height: 100vh; font-family: "Segoe UI", Tahoma, sans-serif; }
        .app-shell { min-height: 100vh; }
        .sidebar { width: 280px; background: var(--bg-sidebar); color:#d2e4ec; padding:20px 16px; }
        .brand-box { background: var(--bg-sidebar-soft); border-radius:12px; padding:14px; margin-bottom:22px; }
        .brand-title { font-size:1rem; color:#fff; margin-bottom:2px; }
        .brand-subtitle { font-size:.8rem; color:#8fb4c3; margin:0; }
        .menu-label { font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:#77a0b1; margin:10px 0 8px; }
        .menu-link { display:flex; align-items:center; justify-content:space-between; color:#d0e4eb; text-decoration:none; border-radius:10px; padding:10px 12px; margin-bottom:6px; transition:.2s; font-size:.93rem; }
        .menu-link:hover,.menu-link.active { background:var(--bg-highlight); color:#fff; }
        .menu-next { font-size:.75rem; color:#81a7b7; }
        .main-content { flex:1; padding:18px 20px; }
        .topbar { background:#fff; border:1px solid var(--card-border); border-radius:14px; padding:10px 14px; margin-bottom:16px; }
        .search-box { border:1px solid #e4edf2; border-radius:10px; padding:8px 12px; width:100%; background:#f8fbfd; }
        .status-chip { background:#e5f7ec; color:#2f8f58; font-size:.78rem; font-weight:600; border-radius:999px; padding:6px 10px; }
        .panel { background:#fff; border:1px solid var(--card-border); border-radius:14px; padding:16px; }
    </style>
</head>
<body>
<div class="d-flex app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>

    <main class="main-content">
        <div th:replace="~{fragments/topbar :: topbar(${remoteUser})}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 mb-1">Usuarios</h1>
                <p class="text-secondary mb-0">Gestion de usuarios del sistema</p>
            </div>
            <a th:if="${permisosSesion.contains('USUARIO:CREAR')}" th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo usuario</a>
        </div>

        <div class="panel">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center text-secondary">No hay usuarios registrados.</td>
                    </tr>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.idUsuario}">1</td>
                        <td th:text="${u.usuario}">usuario</td>
                        <td th:text="${u.nombre}">Nombre</td>
                        <td th:text="${u.apellido}">Apellido</td>
                        <td th:text="${u.email}">email@correo.com</td>
                        <td th:text="${u.estado}">1</td>
                        <td class="d-flex gap-2">
                            <a th:if="${permisosSesion.contains('USUARIO:EDITAR')}" th:href="@{'/usuarios/' + ${u.idUsuario} + '/editar'}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:if="${permisosSesion.contains('USUARIO:ELIMINAR')}" th:action="@{'/usuarios/' + ${u.idUsuario} + '/eliminar'}" method="post" onsubmit="return confirm('Deseas eliminar este usuario?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
